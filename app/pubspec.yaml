name: pillpal
description: PillPal - medication reminder for you and your loved ones.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.4.0
  crypto: ^3.0.3
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_timezone: ^5.1.1
  go_router: ^14.6.0
  home_widget: ^0.9.0
  http: ^1.2.2
  intl: any
  path_provider: ^2.1.4
  pdf: ^3.11.0
  pillpal_core:
    path: ../packages/pillpal_core
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-600.ttf
          weight: 600
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
