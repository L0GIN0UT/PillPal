name: pillpal
description: PillPal - medication reminder for you and your loved ones.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.4.0
  crypto: ^3.0.3
  # Flutter 3.50 deprecates package:flutter/cupertino.dart in favour of cupertino_ui.
  cupertino_ui: ^1.1.6
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  # Exact pin: 7.6.0 drops the plugin's Kotlin jvmTarget 1.8 but keeps Java at
  # 1.8, so its Android build fails. Unpin per docs/backlog.md (Deferred).
  flutter_rustore_push: 7.5.0
  flutter_secure_storage: ^9.2.2
  flutter_timezone: ^5.1.1
  # 18.x is the first go_router built on material_ui; older versions do not see
  # a material_ui MaterialApp and fall back to pages without transitions.
  go_router: ^18.1.4
  home_widget: ^0.9.0
  http: ^1.2.2
  intl: any
  # Flutter 3.50 deprecates package:flutter/material.dart in favour of material_ui.
  material_ui: ^1.11.0
  # Exact pin (docs/phase4-plan.md 4.11): bundled ML Kit on Android; never set
  # dev.steenbakker.mobile_scanner.useUnbundled (checked in CI).
  mobile_scanner: 7.4.2
  path_provider: ^2.1.4
  pdf: ^3.11.0
  pillpal_alerts:
    path: ../packages/pillpal_alerts
  pillpal_core:
    path: ../packages/pillpal_core
  printing: ^5.13.0
  qr_flutter: ^4.1.0
  share_plus: ^11.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  workmanager: ^0.9.0+3

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/GolosText-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-400.ttf
          weight: 400
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-600.ttf
          weight: 600
        - asset: assets/fonts/GolosText-700.ttf
          weight: 700
