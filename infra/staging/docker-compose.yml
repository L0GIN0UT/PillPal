# Personal staging (field test) stack: one region (RU), one host, behind a reverse proxy.
# Guide: docs/staging.md. Lives on the VPS in $STAGING_DIR next to .env and secrets/.
#   cp .env.example .env            # fill every CHANGE_ME
#   docker compose up -d            # nginx recipe, or: COMPOSE_PROFILES=caddy in .env for Caddy
# The deploy workflow (.github/workflows/deploy-staging.yml) overwrites this file and the
# Caddyfile on every run: local settings belong in .env, not here.
name: pillpal-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The global catalog (catalog/README.md, docs/staging.md section 12) runs next to the backend with its
# own PostgreSQL server (owner role for migrations and tools, a read-only role for the public
# service) and its own Redis; it never gets the backend's settings.
#
# Shared by the api, the worker and the one-off migration (docker compose run --rm api ...).
x-backend: &backend
  # The tag is the immutable commit sha: the deploy workflow writes PILLPAL_IMAGE_TAG into .env, so a
  # manual restart never picks up a moved :staging tag.
  image: ${PILLPAL_IMAGE:?set PILLPAL_IMAGE in .env}:${PILLPAL_IMAGE_TAG:?PILLPAL_IMAGE_TAG is written by the deploy workflow}
  restart: unless-stopped
  logging: *logging
  secrets:
    - smtp_password
    - fcm_service_account
  environment: &backend-env
    REGION: ru
    ENVIRONMENT: staging
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pillpal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pillpal}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    # Migrations run as a one-off step of every deploy, never on container start.
    RUN_MIGRATIONS: "0"
    # The missed-dose detector and the push delivery run in the worker (ADR 0007, 0008).
    DETECTOR_ENABLED: "true"
    # Invite links and Android App Links (ADR 0009): the same host serves the API.
    PUBLIC_LINK_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
    ANDROID_PACKAGE_NAME: com.pillpal.pillpal
    ANDROID_CERT_SHA256S: ${ANDROID_CERT_SHA256S:?set ANDROID_CERT_SHA256S in .env}
    # FCM (ADR 0008): the service account key is a Docker secret.
    FCM_PROJECT_ID: ${FCM_PROJECT_ID:?set FCM_PROJECT_ID in .env}
    FCM_SERVICE_ACCOUNT_JSON_FILE: /run/secrets/fcm_service_account
    # Real mail (backend/README.md "E-mail"); staging refuses to start without smtp.
    EMAIL_BACKEND: smtp
    SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
    SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
    SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env}
    # Optional error tracker (milestone 5.13); empty = the SDK is not started.
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    # Catalog contribution link (ADR 0014). Staging refuses CATALOG_CONTRIBUTIONS_ENABLED, so the
    # worker could only retract; both stay empty (= no link) until the private listener has https.
    CATALOG_INTERNAL_URL: ${CATALOG_INTERNAL_URL:-}
    CATALOG_INGEST_TOKEN: ${CATALOG_INGEST_TOKEN:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Shared by the catalog's public and private listeners and its one-off tools. The tag is the commit
# sha of the same deploy as the backend image (both images are built from one commit).
x-catalog: &catalog
  image: ${CATALOG_IMAGE:?set CATALOG_IMAGE in .env}:${PILLPAL_IMAGE_TAG:?PILLPAL_IMAGE_TAG is written by the deploy workflow}
  restart: unless-stopped
  logging: *logging
  environment: &catalog-env
    ENVIRONMENT: staging
    LOG_LEVEL: ${CATALOG_LOG_LEVEL:-INFO}
    # The owner role: migrations, importers, the private listener. The public service overrides it.
    CATALOG_DATABASE_URL: postgresql+asyncpg://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}@catalog-postgres:5432/${CATALOG_POSTGRES_DB:-pillpal_catalog}
    # Its own Redis (rate limits only, no persistence), never the backend's.
    CATALOG_REDIS_URL: redis://:${CATALOG_REDIS_PASSWORD:?set CATALOG_REDIS_PASSWORD in .env}@catalog-redis:6379/0
    CATALOG_RATE_LIMIT_SALT: ${CATALOG_RATE_LIMIT_SALT:?set CATALOG_RATE_LIMIT_SALT in .env}
    # Migrations run as a one-off step of every deploy, never on container start.
    RUN_MIGRATIONS: "0"
    # Both stay false until the owner's checklist is done (catalog/README.md, docs/staging.md).
    CATALOG_IMPORTER_ESKLP_ENABLED: ${CATALOG_IMPORTER_ESKLP_ENABLED:-false}
    CATALOG_IMPORTER_GRLS_ENABLED: ${CATALOG_IMPORTER_GRLS_ENABLED:-false}
  depends_on:
    catalog-db:
      condition: service_completed_successfully
    catalog-redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pillpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pillpal}
    # No ports: reachable only from this compose network (backups use `docker compose exec`).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # The image starts as root and only drops privileges for a bare `redis-server`; this
    # entrypoint is a shell, so run as the redis user (uid 999) from the start. A volume created
    # by an older stack stays owned by root: docs/staging.md ("Redis volume").
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      # The password goes through a config file, not argv: it stays out of `docker top`.
      - 'umask 077; printf "requirepass %s\nappendonly yes\n" "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    # No ports. The job queue and the rate limits live here.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    # Loopback only: a reverse proxy on the host (existing nginx) or the caddy service below
    # terminates TLS. The proxy is the only client; its X-Forwarded-For is trusted only from the
    # pinned compose subnet (the host proxy arrives from the bridge gateway inside it).
    # An nginx that itself runs in a container reaches the host through the gateway address of
    # its Docker network: set API_BIND to that address (docs/staging.md), never to 0.0.0.0.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8000"
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-${STAGING_SUBNET:-172.29.40.0/24}}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ARQ worker: push delivery (10 s), missed-dose detector (1 min), account erase job (hourly),
  # retention (daily). Without it no account deletion completes (ADR 0010).
  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ---- catalog (public reference data only; no accounts, no personal data) -------------------
  # Its own PostgreSQL server: no shared volume, no shared role, and statement logging off (bound
  # parameters would carry what people searched for). The superuser exists only for catalog-db.
  catalog-postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${CATALOG_POSTGRES_ADMIN_USER:-catalog_admin}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_ADMIN_PASSWORD:?set CATALOG_POSTGRES_ADMIN_PASSWORD in .env}
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    # No ports: reachable only from this compose network.
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Its own Redis for the rate limiter: the buckets are keyed hashes of client addresses, so they
  # must not share a server (or a password) with the backend's queue. No volume and no snapshots:
  # a restart forgets every bucket, which is what a one-window counter should do.
  catalog-redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    user: redis
    environment:
      CATALOG_REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?set CATALOG_REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      # The password goes through a config file, not argv: it stays out of `docker top`.
      - 'umask 077; printf "requirepass %s\nsave \"\"\nappendonly no\n" "$$CATALOG_REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$CATALOG_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot and idempotent: creates the database and the non-superuser role the services use
  # (infra/catalog-db/init.sh, uploaded by the deploy) plus the read-only role of the public
  # service. Runs again on every `up`.
  catalog-db:
    image: postgres:16
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "/init.sh"]
    environment:
      POSTGRES_HOST: catalog-postgres
      POSTGRES_USER: ${CATALOG_POSTGRES_ADMIN_USER:-catalog_admin}
      PGPASSWORD: ${CATALOG_POSTGRES_ADMIN_PASSWORD:?set CATALOG_POSTGRES_ADMIN_PASSWORD in .env}
      CATALOG_POSTGRES_DB: ${CATALOG_POSTGRES_DB:-pillpal_catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      CATALOG_READER_USER: ${CATALOG_READER_USER:-catalog_reader}
      CATALOG_READER_PASSWORD: ${CATALOG_READER_PASSWORD:?set CATALOG_READER_PASSWORD in .env}
    volumes:
      - ./catalog-db/init.sh:/init.sh:ro
    depends_on:
      catalog-postgres:
        condition: service_healthy

  # Public API (search, GTIN lookup, product card, sources). Loopback only, like the api: the
  # reverse proxy is the one client: X-Forwarded-For is trusted from Caddy's fixed address and the
  # network gateway (a host nginx arrives from it), not from the whole subnet. It connects with the
  # read-only role and holds no token digests: it authenticates nobody.
  catalog:
    <<: *catalog
    ports:
      - "${CATALOG_BIND:-127.0.0.1}:${CATALOG_PORT:-8081}:8000"
    environment:
      <<: *catalog-env
      CATALOG_DATABASE_URL: postgresql+asyncpg://${CATALOG_READER_USER:-catalog_reader}:${CATALOG_READER_PASSWORD:?set CATALOG_READER_PASSWORD in .env}@catalog-postgres:5432/${CATALOG_POSTGRES_DB:-pillpal_catalog}
      FORWARDED_ALLOW_IPS: ${CATALOG_FORWARDED_ALLOW_IPS:-${CADDY_IPV4:-172.29.40.10},${STAGING_GATEWAY:-172.29.40.1}}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Private listener: /internal (regional ingest) and /admin, plus the maintenance loop. No ports
  # and no proxy route: only containers of this network reach it (catalog/README.md).
  catalog-private:
    <<: *catalog
    command: ["uvicorn", "catalog.private_app:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      <<: *catalog-env
      # Digests (SHA-256) of the secrets, never the secrets: catalog/README.md "Settings". Only this
      # service gets them.
      CATALOG_ADMIN_TOKENS: ${CATALOG_ADMIN_TOKENS:?set CATALOG_ADMIN_TOKENS in .env}
      CATALOG_INGEST_TOKENS: ${CATALOG_INGEST_TOKENS:?set CATALOG_INGEST_TOKENS in .env}
      CATALOG_ACCEPTED_REGIONS: ru
      # No proxy sits in front of it: nobody's X-Forwarded-For is believed.
      FORWARDED_ALLOW_IPS: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # On-demand tools, never started by `up` (profile): importers and the admin CLI, e.g.
  #   docker compose run --rm catalog-tools python -m catalog.importers run --source rxnorm --snapshot /data/rxnorm
  # Also the migration runner (alembic upgrade head) and the admin CLI: it is the owner role.
  # ./catalog-import must exist on the host, owned by uid 10001, before the first import:
  #   mkdir -p catalog-import && sudo chown 10001:10001 catalog-import && chmod 700 catalog-import
  # (docs/staging.md section 12.1).
  catalog-tools:
    <<: *catalog
    profiles: [tools]
    restart: "no"
    volumes:
      - ./catalog-import:/data

  # Optional: automatic HTTPS when no reverse proxy exists on the host yet.
  # Enable with COMPOSE_PROFILES=caddy in .env. Needs ports 80 and 443 free on the host.
  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env}
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:?set CATALOG_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      # Started, not healthy: a broken catalog must not keep the API behind Caddy offline.
      catalog:
        condition: service_started
    # A fixed address, so the catalog can trust X-Forwarded-For from this one proxy only.
    networks:
      default:
        ipv4_address: ${CADDY_IPV4:-172.29.40.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${STAGING_SUBNET:-172.29.40.0/24}
          # Dynamic addresses only from the upper half, so the fixed CADDY_IPV4 is never handed out.
          ip_range: ${STAGING_DYNAMIC_RANGE:-172.29.40.128/25}

secrets:
  smtp_password:
    file: ./secrets/smtp_password
  fcm_service_account:
    file: ./secrets/fcm_service_account.json

volumes:
  pgdata:
  redisdata:
  catalog_pgdata:
  caddy_data:
  caddy_config:
