version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(backend)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # arq (the worker) caps redis below 6; revisit together with an arq release that lifts it.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /packages/pillpal_core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(core)"
    groups:
      dart-minor-patch:
        update-types: [minor, patch]

  # Phase 2: add a "pub" entry for /app once app/pubspec.yaml exists.

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(infra)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
