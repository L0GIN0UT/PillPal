name: app-ios

# iOS build without signing (milestone 2.5): compiles AppDelegate.swift, the
# plugins (CocoaPods) and the Runner project with its entitlements. No
# simulator tests yet: the reminder scenarios on iOS are a manual checklist
# (docs/phase2-plan.md). macOS minutes are expensive, so this runs only when
# the iOS project or this workflow changes, on push to main and by hand.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app-ios.yml"
  pull_request:
    paths:
      - "app/ios/**"
      - ".github/workflows/app-ios.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios:
    name: build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Xcode cannot provision the Associated Domains capability without a
      # development team, even with signing disabled (the build fails with
      # "requires a Development Team"). The unsigned build therefore runs
      # without that entitlement, after checking the file: it must stay valid
      # and must claim exactly the hosts of Links.xcconfig. Signed builds (the
      # owner's, in Xcode) keep it (docs/phase3-plan.md, owner checklist).
      #
      # The same holds for Push Notifications: `aps-environment` is checked
      # (it must say development, Xcode switches it for distribution) and
      # dropped here.
      - name: Check the entitlements, then drop Associated Domains and Push for this build
        working-directory: app/ios
        run: |
          plutil -lint Runner/Runner.entitlements
          for variable in PILLPAL_LINK_HOST_RU PILLPAL_LINK_HOST_EU; do
            grep -q "applinks:\$($variable)" Runner/Runner.entitlements
            grep -q "^$variable = " Flutter/Links.xcconfig
          done
          test "$(/usr/libexec/PlistBuddy -c "Print :aps-environment" Runner/Runner.entitlements)" = development
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" Runner/Runner.entitlements

      - name: Build
        run: |
          if ! flutter build ios --debug --no-codesign --no-pub -v \
            --dart-define=PILLPAL_REGION=ru > build.txt 2>&1; then
            cat build.txt
            # Compiler errors first, then the tail for context.
            { grep -E "error:|Error:|Failed|Signing for|requires a development team|code sign" build.txt | head -n 60; tail -n 60 build.txt; } \
              > build-errors.txt
            python3 ../.github/scripts/annotate.py "flutter build ios" build-errors.txt
            exit 1
          fi
          tail -n 3 build.txt

      # The alert pushes name only a loc-key: the texts must be in the bundle,
      # in both languages, with every key the backend sends.
      - name: Check the localized alert texts are bundled
        run: |
          app=build/ios/iphoneos/Runner.app
          for language in en ru; do
            file="$app/$language.lproj/Localizable.strings"
            test -f "$file"
            plutil -lint "$file"
            for key in relatives_alert_1 relatives_alert_2 relatives_alert_3 relatives_alert_4; do
              plutil -extract "$key" raw "$file" > /dev/null
            done
          done
