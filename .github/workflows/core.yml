name: core

on:
  pull_request:
    paths:
      - "packages/pillpal_core/**"
      - "spec/**"
      - ".github/workflows/core.yml"
  push:
    branches: [main]
    paths:
      - "packages/pillpal_core/**"
      - "spec/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dart:
    name: format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/pillpal_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # pub get must run first: dart format resolves the language version from package_config.json.
      - name: Install dependencies
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test (includes shared schedule vectors)
        run: dart test
