name: repo

# Always runs (no path filter) so every PR, including docs-only ones, gets a quick
# green check. Use "repo / workflows" as the required status check in branch
# protection; path-filtered workflows (backend, core, app) must not be required,
# otherwise PRs that do not touch them would wait forever.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: actionlint
        run: |
          pip install actionlint-py
          actionlint

      # The staging stack must stay valid with the documented example settings (docs/staging.md).
      - name: staging compose config
        working-directory: infra/staging
        env:
          PILLPAL_IMAGE_TAG: ci
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=caddy docker compose config --quiet

      # The bundled Caddy config must parse, with the image tag the compose file pins.
      - name: staging Caddyfile validate
        run: |
          docker run --rm \
            -e PUBLIC_DOMAIN=example.test -e CATALOG_DOMAIN=catalog.example.test \
            -v "$PWD/infra/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The landing page loads nothing from other hosts and has no inline code the CSP blocks.
      - name: landing page is same-origin
        run: |
          python .github/scripts/check_landing_site.py --self-test
          python .github/scripts/check_landing_site.py infra/staging/site
