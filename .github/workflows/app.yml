name: app

# Flutter app checks. Skipped (successful no-op) until app/pubspec.yaml exists. Findings are emitted
# as annotations so they are readable through the checks API, not only in raw logs.

on:
  pull_request:
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app exists
        id: guard
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/pubspec.yaml not found - Flutter checks skipped."
          fi
          if [ -d app/android ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate l10n
        id: pubget
        if: steps.guard.outputs.exists == 'true'
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Code generation
        if: steps.pubget.outcome == 'success' && hashFiles('app/build.yaml', 'app/lib/**/*.drift', 'app/lib/**/database.dart') != ''
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: always() && steps.pubget.outcome == 'success'
        run: |
          if ! flutter analyze --fatal-infos --no-pub > analyze.txt 2>&1; then
            grep -E '^ *(error|warning|info) - ' analyze.txt | while IFS= read -r row; do
              location="$(echo "$row" | sed -E 's/.* - ([^ ]+:[0-9]+:[0-9]+) - .*/\1/')"
              file="${location%%:*}"
              rest="${location#*:}"
              line="${rest%%:*}"
              echo "::error file=app/${file},line=${line}::${row}"
            done
            cat analyze.txt
            exit 1
          fi

      - name: Install SQLite for drift tests
        if: steps.pubget.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Test
        if: always() && steps.pubget.outcome == 'success'
        run: flutter test --no-pub --reporter github

      - name: Format
        if: always() && steps.pubget.outcome == 'success'
        run: |
          # Generated code (build_runner *.g.dart, gen-l10n) is not formatted or committed.
          mapfile -t sources < <(git ls-files 'lib/*.dart' 'test/*.dart')
          if ! dart format --output=none --set-exit-if-changed "${sources[@]}"; then
            dart format "${sources[@]}" > /dev/null
            diff="$(git diff -- lib test)"
            diff="${diff//'%'/'%25'}"
            diff="${diff//$'\n'/'%0A'}"
            diff="${diff//$'\r'/'%0D'}"
            echo "::error title=dart format diff::${diff}"
            exit 1
          fi

      - name: Build debug APK
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: flutter build apk --debug --no-pub
