name: app

# Flutter app checks. Skipped (successful no-op) until app/pubspec.yaml exists. Findings are emitted
# as annotations so they are readable through the checks API, not only in raw logs.

on:
  pull_request:
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app exists
        id: guard
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/pubspec.yaml not found - Flutter checks skipped."
          fi
          if [ -d app/android ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate l10n
        id: pubget
        if: steps.guard.outputs.exists == 'true'
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Code generation
        if: steps.pubget.outcome == 'success' && hashFiles('app/build.yaml', 'app/lib/**/*.drift', 'app/lib/**/database.dart') != ''
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: always() && steps.pubget.outcome == 'success'
        run: |
          if ! flutter analyze --fatal-infos --no-pub > analyze.txt 2>&1; then
            cat analyze.txt
            python3 ../.github/scripts/annotate.py "flutter analyze" analyze.txt
            exit 1
          fi

      - name: Install SQLite for drift tests
        if: always() && steps.pubget.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Test
        if: always() && steps.pubget.outcome == 'success'
        run: |
          if ! flutter test --no-pub --reporter expanded > test.txt 2>&1; then
            cat test.txt
            # Drop progress lines of passing tests; keep failures and load errors.
            awk '!/^[0-9]+:[0-9]+ \+[0-9]+/ || /\[E\]/' test.txt > failures.txt
            python3 ../.github/scripts/annotate.py "flutter test" failures.txt
            exit 1
          fi
          tail -n 3 test.txt

      - name: Format
        if: always() && steps.pubget.outcome == 'success'
        run: |
          # Generated code (build_runner *.g.dart, gen-l10n) is not formatted or committed.
          mapfile -t sources < <(git ls-files 'lib/*.dart' 'test/*.dart' 'test_e2e/*.dart' \
            'integration_test/*.dart' 'test_driver/*.dart')
          if ! dart format --output=none --set-exit-if-changed "${sources[@]}"; then
            dart format "${sources[@]}" > /dev/null
            # Zero-context diff: apply with `git apply --unidiff-zero`.
            git diff -U0 -- lib test test_e2e integration_test test_driver > format.diff
            python3 ../.github/scripts/annotate.py "dart format diff" format.diff
            exit 1
          fi

      - name: Build debug APK
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: flutter build apk --debug --no-pub

      # Push settings are optional (docs/adr/0008-push-delivery.md §7): the
      # build above has none and must carry no Firebase resources and no
      # RuStore project; the one below is given synthetic settings and must
      # carry them natively. No real credentials are involved either way.
      - name: Check the build without push settings
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: |
          python3 ../.github/scripts/check_push_build.py --self-test
          python3 ../.github/scripts/check_push_build.py debug

      - name: Build debug APK with synthetic push settings and check it
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=PILLPAL_FCM_API_KEY=synthetic-api-key \
            --dart-define=PILLPAL_FCM_APP_ID=1:000000000000:android:0000000000000000 \
            --dart-define=PILLPAL_FCM_SENDER_ID=000000000000 \
            --dart-define=PILLPAL_FCM_PROJECT_ID=synthetic-project \
            --dart-define=PILLPAL_RUSTORE_PROJECT_ID=synthetic-rustore-project
          python3 ../.github/scripts/check_push_build.py debug --fcm \
            --rustore-project synthetic-rustore-project

  e2e:
    # Two app installations of one account against the real backend
    # (PostgreSQL + Redis + uvicorn): register, verify (code from the dev log),
    # write/edit/delete, sync both, assert convergence.
    name: e2e against the real backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pillpal_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pillpal_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pillpal_e2e
      REDIS_URL: redis://localhost:6379/0
      REGION: ru
      ENVIRONMENT: test
      # Dev/test only (rejected when ENVIRONMENT=prod): verification codes in the log.
      LOG_EMAIL_CODES: "true"
      # Throwaway value; Settings requires >= 32 characters.
      JWT_SECRET: e2e-secret-not-for-prod-e2e-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app exists
        id: guard
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.exists == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Start the backend
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate code
        if: steps.guard.outputs.exists == 'true'
        working-directory: app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: E2E tests
        if: steps.guard.outputs.exists == 'true'
        working-directory: app
        env:
          PILLPAL_E2E_BASE_URL: http://127.0.0.1:8000
          PILLPAL_E2E_LOG: ${{ runner.temp }}/backend.log
        run: |
          # One test file at a time: the files share one backend and one log, and
          # the verification code of a registration is found in that log.
          if ! flutter test --no-pub --concurrency=1 --reporter expanded test_e2e > e2e.txt 2>&1; then
            cat e2e.txt
            awk '!/^[0-9]+:[0-9]+ \+[0-9]+/ || /\[E\]/' e2e.txt > failures.txt
            python3 ../.github/scripts/annotate.py "e2e test" failures.txt
            # Backend log without request bodies (it never logs them) for context.
            tail -n 60 "$RUNNER_TEMP/backend.log" > backend-tail.txt
            python3 ../.github/scripts/annotate.py "backend log" backend-tail.txt
            exit 1
          fi
          tail -n 3 e2e.txt
          echo "::notice title=e2e summary::$(tail -n 1 e2e.txt)"
          if grep -q "Skip:" e2e.txt; then
            echo "::error::e2e tests were skipped"
            exit 1
          fi

      # The backend runs under `uv run`, which holds uv's cache lock; setup-uv's
      # post step prunes the cache and fails while the lock is held.
      - name: Stop the backend
        if: always() && steps.guard.outputs.exists == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
            pkill -f "uvicorn app.main:app" 2>/dev/null || true
          fi
          # Wait (up to ~10 s) until the processes are gone: they hold uv's cache lock.
          for _ in $(seq 1 20); do
            pgrep -f "uvicorn app.main:app" > /dev/null || exit 0
            sleep 0.5
          done
          echo "::warning::the backend did not stop within 10 s"
