name: app

# Flutter app checks. Skipped (successful no-op) until app/pubspec.yaml exists. Findings are emitted
# as annotations so they are readable through the checks API, not only in raw logs.

on:
  # catalog.yml and backend.yml own the catalog and backend code paths; the e2e job below
  # covers their contract with the app whenever app code (or this file) changes, to keep
  # the number of CI runs down.
  pull_request:
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - "packages/pillpal_alerts/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - "packages/pillpal_alerts/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter:
    name: analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # The hosted runner image ships many GB of toolchains we never use; the
      # Android build (Gradle caches, merged native libs) otherwise ends with
      # "No space left on device". The Android SDK, NDK and Java are kept.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup             /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /

      - name: Check whether the app exists
        id: guard
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app/pubspec.yaml not found - Flutter checks skipped."
          fi
          if [ -d app/android ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate l10n
        id: pubget
        if: steps.guard.outputs.exists == 'true'
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Code generation
        if: steps.pubget.outcome == 'success' && hashFiles('app/build.yaml', 'app/lib/**/*.drift', 'app/lib/**/database.dart') != ''
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        if: always() && steps.pubget.outcome == 'success'
        run: |
          if ! flutter analyze --fatal-infos --no-pub > analyze.txt 2>&1; then
            cat analyze.txt
            python3 ../.github/scripts/annotate.py "flutter analyze" analyze.txt
            exit 1
          fi

      - name: Check UI literal guard
        if: always() && steps.guard.outputs.exists == 'true'
        working-directory: .
        run: |
          python3 .github/scripts/check_ui_tokens.py --self-test
          python3 .github/scripts/check_ui_tokens.py check

      - name: Install SQLite for drift tests
        if: always() && steps.pubget.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Test
        if: always() && steps.pubget.outcome == 'success'
        run: |
          if ! flutter test --no-pub --reporter expanded > test.txt 2>&1; then
            cat test.txt
            # Drop progress lines of passing tests; keep failures and load errors.
            awk '!/^[0-9]+:[0-9]+ \+[0-9]+/ || /\[E\]/' test.txt > failures.txt
            python3 ../.github/scripts/annotate.py "flutter test" failures.txt
            exit 1
          fi
          tail -n 3 test.txt

      - name: Format
        if: always() && steps.pubget.outcome == 'success'
        run: |
          # Generated code (build_runner *.g.dart, gen-l10n) is not formatted or committed.
          mapfile -t sources < <(git ls-files 'lib/*.dart' 'test/*.dart' 'test_e2e/*.dart' \
            'integration_test/*.dart' 'test_driver/*.dart')
          if ! dart format --output=none --set-exit-if-changed "${sources[@]}"; then
            dart format "${sources[@]}" > /dev/null
            # Zero-context diff: apply with `git apply --unidiff-zero`.
            git diff -U0 -- lib test test_e2e integration_test test_driver > format.diff
            python3 ../.github/scripts/annotate.py "dart format diff" format.diff
            exit 1
          fi

      - name: Build debug APK
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: flutter build apk --debug --no-pub

      # Barcode scanning stays on the bundled ML Kit model (docs/phase4-plan.md
      # 4.11): exact scanner pin, no Play Services flavour in any Gradle file,
      # camera permission and RU/EN usage strings present.
      - name: Check the scanner configuration
        if: steps.guard.outputs.exists == 'true'
        working-directory: .
        run: |
          python3 .github/scripts/check_scanner_build.py --self-test
          python3 .github/scripts/check_scanner_build.py source

      # Push settings are optional (docs/adr/0008-push-delivery.md §7): the
      # build above has none and must carry no Firebase resources and no
      # RuStore project; the one below is given synthetic settings and must
      # carry them natively. No real credentials are involved either way.
      - name: Check the build without push settings
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        run: |
          python3 ../.github/scripts/check_push_build.py --self-test
          python3 ../.github/scripts/check_push_build.py debug

      # The real RuStore SDK is on a VK repository that does not answer to
      # GitHub-hosted runners, so this build compiles against the stub of the
      # SDK as well (app/android/rustore_sdk_stub); the manifest and resources
      # are what is checked.
      - name: Build debug APK with synthetic push settings and check it
        if: steps.pubget.outcome == 'success' && steps.guard.outputs.android == 'true'
        env:
          ORG_GRADLE_PROJECT_pillpalRustoreSdk: stub
        run: |
          # The first build's Gradle and Kotlin daemons (8 GB heap) are still
          # resident; a second JVM set next to them stalls or gets the runner
          # killed (exit 143) on the hosted image.
          (cd android && ./gradlew --stop)
          flutter build apk --debug --no-pub \
            --dart-define=PILLPAL_REGION=ru \
            --dart-define=PILLPAL_FCM_API_KEY=synthetic-api-key \
            --dart-define=PILLPAL_FCM_APP_ID=1:000000000000:android:0000000000000000 \
            --dart-define=PILLPAL_FCM_SENDER_ID=000000000000 \
            --dart-define=PILLPAL_FCM_PROJECT_ID=synthetic-project \
            --dart-define=PILLPAL_RUSTORE_PROJECT_ID=synthetic-rustore-project
          python3 ../.github/scripts/check_push_build.py debug --fcm \
            --rustore-project synthetic-rustore-project

  e2e:
    # Two app installations of one account against the real backend
    # (PostgreSQL + Redis + uvicorn): register, verify (code from the dev log),
    # write/edit/delete, sync both, assert convergence. Milestone 4.12 adds the
    # real catalog service (own database, Redis index 3, loaded with the
    # synthetic fixture): `catalog_test.dart`.
    name: e2e against the real backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pillpal_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pillpal_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pillpal_e2e
      REDIS_URL: redis://localhost:6379/0
      REGION: ru
      ENVIRONMENT: test
      # Dev/test only (rejected when ENVIRONMENT=prod): verification codes in the log.
      LOG_EMAIL_CODES: "true"
      # Throwaway value; Settings requires >= 32 characters.
      JWT_SECRET: e2e-secret-not-for-prod-e2e-secret-not-for-prod
      # The backend's link to the catalog's private listener (ADR 0014): the
      # consensus journey lets this region report counts. Throwaway secret
      # (>= 32 characters); the catalog gets only its SHA-256.
      CATALOG_CONTRIBUTIONS_ENABLED: "true"
      CATALOG_INTERNAL_URL: http://127.0.0.1:8001
      CATALOG_INGEST_TOKEN: e2e-ingest-secret-not-for-prod-0123456789
    steps:
      - uses: actions/checkout@v7

      - name: Check whether the app exists
        id: guard
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            catalog/uv.lock

      # Its own database and Redis index: nothing is shared with the backend.
      # Public API on :8002, private listener (ingest) on :8001.
      - name: Start the catalog and load the synthetic fixture
        if: steps.guard.outputs.exists == 'true'
        working-directory: catalog
        env:
          PGPASSWORD: postgres
          CATALOG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pillpal_catalog_e2e
          CATALOG_REDIS_URL: redis://localhost:6379/3
          CATALOG_ACCEPTED_REGIONS: ru
        run: |
          psql -h localhost -U postgres -c 'create database pillpal_catalog_e2e'
          CATALOG_INGEST_TOKENS="ru-e2e:$(printf '%s' "$CATALOG_INGEST_TOKEN" | sha256sum | cut -d' ' -f1)"
          export CATALOG_INGEST_TOKENS
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m catalog.importers run --source fixture --snapshot tests/fixtures/fixture/v1
          nohup uv run uvicorn catalog.main:app --host 127.0.0.1 --port 8002 --no-access-log \
            > "$RUNNER_TEMP/catalog.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/catalog.pid"
          nohup uv run uvicorn catalog.private_app:app --host 127.0.0.1 --port 8001 --no-access-log \
            > "$RUNNER_TEMP/catalog-private.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/catalog-private.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8002/readyz > /dev/null \
              && curl -fsS http://127.0.0.1:8001/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8002/readyz > /dev/null || echo "::error::the public catalog listener (:8002) is not ready"
          curl -fsS http://127.0.0.1:8001/readyz > /dev/null || echo "::error::the private catalog listener (:8001) is not ready"
          cat "$RUNNER_TEMP/catalog.log" "$RUNNER_TEMP/catalog-private.log"
          exit 1

      - name: Start the backend
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies and generate code
        if: steps.guard.outputs.exists == 'true'
        working-directory: app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # The aggregate trigger writes to the database it is pointed at: prove it
      # refuses outside a test setup before the journeys rely on it.
      - name: Check that the aggregate trigger refuses outside a test setup
        if: steps.guard.outputs.exists == 'true'
        working-directory: backend
        env:
          ENVIRONMENT: dev
        run: |
          status=0
          uv run python ../.github/scripts/e2e/catalog_aggregate.py || status=$?
          test "$status" -eq 2

      - name: E2E tests
        if: steps.guard.outputs.exists == 'true'
        working-directory: app
        env:
          PILLPAL_E2E_BASE_URL: http://127.0.0.1:8000
          PILLPAL_E2E_LOG: ${{ runner.temp }}/backend.log
          PILLPAL_E2E_CATALOG_URL: http://127.0.0.1:8002
          # What the worker does hourly in production, once, on demand (the
          # script backdates the synthetic accounts: only accounts older than
          # a week count, owner decision D8).
          PILLPAL_E2E_AGGREGATE_CMD: cd "${{ github.workspace }}/backend" && uv run python ../.github/scripts/e2e/catalog_aggregate.py
        run: |
          # One test file at a time: the files share one backend, one catalog
          # and one log, and the verification code of a registration is found
          # in that log.
          if ! flutter test --no-pub --concurrency=1 --reporter expanded test_e2e > e2e.txt 2>&1; then
            cat e2e.txt
            awk '!/^[0-9]+:[0-9]+ \+[0-9]+/ || /\[E\]/' e2e.txt > failures.txt
            python3 ../.github/scripts/annotate.py "e2e test" failures.txt
            # Backend log without request bodies (it never logs them) for context.
            tail -n 60 "$RUNNER_TEMP/backend.log" > backend-tail.txt
            python3 ../.github/scripts/annotate.py "backend log" backend-tail.txt
            # The catalog logs routes and counts only, never a request body.
            tail -n 40 "$RUNNER_TEMP/catalog.log" "$RUNNER_TEMP/catalog-private.log" > catalog-tail.txt
            python3 ../.github/scripts/annotate.py "catalog log" catalog-tail.txt
            exit 1
          fi
          tail -n 3 e2e.txt
          echo "::notice title=e2e summary::$(tail -n 1 e2e.txt)"
          if grep -q "Skip:" e2e.txt; then
            echo "::error::e2e tests were skipped"
            exit 1
          fi

      # The backend and the catalog run under `uv run`, which holds uv's cache
      # lock; setup-uv's post step prunes the cache and fails while it is held.
      - name: Stop the backend and the catalog
        if: always() && steps.guard.outputs.exists == 'true'
        run: |
          for pidfile in backend catalog catalog-private; do
            if [ -f "$RUNNER_TEMP/$pidfile.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/$pidfile.pid")" 2>/dev/null || true
            fi
          done
          # Fallback: the `uv run` wrapper may leave its child behind.
          pkill -f "uvicorn app.main:app" 2>/dev/null || true
          pkill -f "uvicorn catalog\." 2>/dev/null || true
          # Wait (up to ~10 s) until the processes are gone: they hold uv's cache lock.
          for _ in $(seq 1 20); do
            pgrep -f "uvicorn (app\.main|catalog\.)" > /dev/null || exit 0
            sleep 0.5
          done
          echo "::warning::the backend or the catalog did not stop within 10 s"
