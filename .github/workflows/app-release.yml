name: app-release

# Release builds of the Android app (milestone 2.5): an App Bundle and an APK,
# uploaded as the "android-release" artifact. Not run on every PR (minutes):
# on push to main, by hand, and on PRs that change this workflow or the
# Android build script.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the
# upload keystore), ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD the builds are signed with the upload key; without
# them, with the debug key (installable for testing, not uploadable).
# Signing secrets are used only on push to main and manual runs, never in
# pull_request runs (code under review must not run with the upload key).
# The API base URL is the repository variable PILLPAL_API_BASE_URL_RU, or an
# https placeholder until a deployment exists (release builds require https).
# Invite link hosts: the repository variables PILLPAL_LINK_HOST_RU and
# PILLPAL_LINK_HOST_EU, or ".invalid" placeholders (never verified). The merged
# manifest is checked: invite links are verified https App Links only.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app-release.yml"
  pull_request:
    paths:
      - ".github/workflows/app-release.yml"
      - ".github/scripts/check_manifest_links.py"
      - "app/android/app/build.gradle.kts"
      - "app/android/app/src/main/AndroidManifest.xml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: release App Bundle and APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ vars.PILLPAL_API_BASE_URL_RU || 'https://api.example.invalid' }}
      LINK_HOSTS: ru=${{ vars.PILLPAL_LINK_HOST_RU || 'links-ru.pillpal.invalid' }},eu=${{ vars.PILLPAL_LINK_HOST_EU || 'links-eu.pillpal.invalid' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned by commit (v2.23.0): this job later handles signing secrets.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signing=upload key" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug key (no ANDROID_KEYSTORE_BASE64 secret)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          defines=(
            "--dart-define=PILLPAL_API_BASE_URL=$API_BASE_URL"
            "--dart-define=PILLPAL_REGION=ru"
            "--dart-define=PILLPAL_LINK_HOSTS=$LINK_HOSTS"
          )
          for target in appbundle apk; do
            # With pub (no --no-pub): the plugin registrant is regenerated for
            # release, without the dev-only plugins (integration_test).
            if ! flutter build "$target" --release "${defines[@]}" \
              > "build-$target.txt" 2>&1; then
              cat "build-$target.txt"
              tail -n 80 "build-$target.txt" > build-tail.txt
              python3 ../.github/scripts/annotate.py "flutter build $target" build-tail.txt
              exit 1
            fi
            tail -n 3 "build-$target.txt"
          done
          # Dev-only plugins (integration_test) must not reach release builds.
          registrant=android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          if grep -q integrationtest "$registrant"; then
            echo "::error::integration_test is registered in the release plugin registrant"
            exit 1
          fi
          {
            echo "### Android release builds"
            echo "- signed with: ${{ steps.keystore.outputs.signing }}"
            echo "- API base URL: \`$API_BASE_URL\`, region \`ru\`"
            for file in build/app/outputs/bundle/release/app-release.aab \
              build/app/outputs/flutter-apk/app-release.apk; do
              echo "- \`$(basename "$file")\`: $(du -h "$file" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=release builds::signed with the ${{ steps.keystore.outputs.signing }}"

      # Invite tokens must never be claimable by another app: no custom URL
      # scheme, only verified https App Links, in the app and in every plugin.
      - name: Check the merged manifest for VIEW intent filters
        run: |
          python3 ../.github/scripts/check_manifest_links.py --self-test
          # Every merged manifest of the release variant (AGP versions differ
          # in how many it keeps).
          mapfile -t manifests < <(find build/app/intermediates/merged_manifests/release -name AndroidManifest.xml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::merged release manifest not found"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            python3 ../.github/scripts/check_manifest_links.py "$manifest"
          done
          # The Gradle placeholders must resolve to the configured hosts.
          ru_host=${LINK_HOSTS#ru=}
          ru_host=${ru_host%%,*}
          eu_host=${LINK_HOSTS##*,eu=}
          for host in "$ru_host" "$eu_host"; do
            if ! cat "${manifests[@]}" | grep -q "android:host=\"$host\""; then
              echo "::error::link host $host is not in the merged manifest"
              exit 1
            fi
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
