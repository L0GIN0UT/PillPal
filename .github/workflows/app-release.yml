name: app-release

# Release builds of the Android app (milestone 2.5): an App Bundle and an APK,
# uploaded as the "android-release" artifact. Not run on every PR (minutes):
# on push to main, by hand, and on PRs that change this workflow or the
# Android build script.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the
# upload keystore), ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_PASSWORD the builds are signed with the upload key; without
# them, with the debug key (installable for testing, not uploadable).
# The API base URL is the repository variable PILLPAL_API_BASE_URL_RU, or an
# https placeholder until a deployment exists (release builds require https).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/pillpal_core/**"
      - ".github/workflows/app-release.yml"
  pull_request:
    paths:
      - ".github/workflows/app-release.yml"
      - "app/android/app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: release App Bundle and APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      API_BASE_URL: ${{ vars.PILLPAL_API_BASE_URL_RU || 'https://api.example.invalid' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies and generate code
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signing=upload key" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug key (no ANDROID_KEYSTORE_BASE64 secret)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          defines=(
            "--dart-define=PILLPAL_API_BASE_URL=$API_BASE_URL"
            "--dart-define=PILLPAL_REGION=ru"
          )
          for target in appbundle apk; do
            if ! flutter build "$target" --release --no-pub "${defines[@]}" \
              > "build-$target.txt" 2>&1; then
              cat "build-$target.txt"
              tail -n 80 "build-$target.txt" > build-tail.txt
              python3 ../.github/scripts/annotate.py "flutter build $target" build-tail.txt
              exit 1
            fi
            tail -n 3 "build-$target.txt"
          done
          {
            echo "### Android release builds"
            echo "- signed with: ${{ steps.keystore.outputs.signing }}"
            echo "- API base URL: \`$API_BASE_URL\`, region \`ru\`"
            for file in build/app/outputs/bundle/release/app-release.aab \
              build/app/outputs/flutter-apk/app-release.apk; do
              echo "- \`$(basename "$file")\`: $(du -h "$file" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=release builds::signed with the ${{ steps.keystore.outputs.signing }}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
